 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Search the Holy Bible in the King James Version through Life in Holy Bible.">
<meta name="theme-color" content="#000814">
<meta property="og:title" content="Global Bible Search (KJV) | Life in Holy Bible">
<meta property="og:description" content="Search words and verses in the King James Version of the Holy Bible.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lifeinholybible.org/bible-search.html">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://lifeinholybible.org/bible-search.html">

<title>Global Bible Search (KJV) | Life in Holy Bible</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top, #0a1a3a, #000814 70%);
  color: #ffffff;
  min-height: 100vh;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

h1 {
  text-align: center;
  color: #ffd700;
  letter-spacing: 1px;
  margin-bottom: 10px;
  font-size: clamp(2rem, 6vw, 3rem);
}

.subtitle {
  text-align: center;
  opacity: 0.8;
  margin-bottom: 30px;
  line-height: 1.7;
}

input {
  width: 100%;
  padding: 16px 18px;
  font-size: 16px;
  border-radius: 12px;
  border: 2px solid transparent;
  outline: none;
  margin-bottom: 30px;
}

input:focus-visible {
  border-color: #ffd700;
  box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.18);
}

.result {
  background: rgba(255, 255, 255, 0.08);
  padding: 18px 20px;
  border-radius: 16px;
  margin-bottom: 16px;
  backdrop-filter: blur(6px);
  line-height: 1.7;
}

.reference {
  color: #ffd700;
  font-weight: bold;
  margin-bottom: 6px;
}

.highlight {
  background: rgba(255, 215, 0, 0.35);
  padding: 0 4px;
  border-radius: 4px;
}

footer {
  text-align: center;
  margin-top: 60px;
  font-size: 14px;
  opacity: 0.6;
  line-height: 1.7;
}

@media (max-width: 520px) {
  .container {
    padding: 28px 14px;
  }

  input {
    font-size: 16px;
    padding: 15px 14px;
  }

  .result {
    padding: 16px 14px;
  }
}
</style>
</head>

<body>

<main class="container">
  <h1>Global Bible Search (KJV)</h1>
  <div class="subtitle">
    Search the Holy Bible • King James Version
  </div>

  <label for="searchInput" class="visually-hidden">Search words like faith, love, salvation…</label>
  <input
    id="searchInput"
    type="text"
    placeholder="Search words like faith, love, salvation…"
    autocomplete="off"
    aria-describedby="searchHelp"
  />
  <p id="searchHelp" class="visually-hidden">
    Type at least two letters to search Bible verses.
  </p>

  <div id="results" aria-live="polite"></div>

  <footer>
    Life in Holy Bible • Word of God
  </footer>
</main>

<!-- ✅ CACHE-BUSTING SCRIPT (OPTION 3) -->
<script src="js/bible-search.js?v=1.1"></script>

</body>
</html>
