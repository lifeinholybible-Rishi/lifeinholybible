<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Read Book of Know Truth pages with Home, Reader Library, Original Library, Previous, Next, Large Text, Plain Mode, and Print controls.">
<meta name="theme-color" content="#050814">
<title>Book Reader | Life in Holy Bible</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #050814;
  color: #ffffff;
}
.reader-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  padding: 12px;
  background: rgba(0, 0, 0, 0.9);
  border-bottom: 1px solid rgba(255, 215, 0, 0.35);
}
.reader-nav a,
.reader-nav button {
  min-height: 40px;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 215, 0, 0.45);
  background: rgba(255, 215, 0, 0.1);
  color: #ffffff;
  text-decoration: none;
  cursor: pointer;
  font: inherit;
}
.reader-nav a:hover,
.reader-nav button:hover,
.reader-nav a:focus-visible,
.reader-nav button:focus-visible {
  border-color: #ffd700;
  box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.18);
  outline: none;
}
.reader-status {
  text-align: center;
  padding: 12px;
  color: #ffd700;
}
#bookContent {
  min-height: 60vh;
}
body.reader-large-text #bookContent {
  font-size: 118%;
}
body.reader-large-text #bookContent table {
  line-height: 1.9;
}
body.reader-plain-mode,
body.reader-plain-mode #bookContent,
body.reader-plain-mode #bookContent * {
  background: #ffffff !important;
  color: #111111 !important;
}
body.reader-plain-mode .reader-nav,
body.reader-plain-mode .reader-status {
  background: #111111 !important;
  color: #ffd700 !important;
}
@media print {
  .reader-nav,
  .reader-status {
    display: none !important;
  }
}
@media (max-width: 720px) {
  .reader-nav a,
  .reader-nav button {
    flex: 1 1 calc(50% - 10px);
    font-size: 14px;
  }
}
</style>
</head>
<body>
<nav class="reader-nav" aria-label="Book reader navigation">
  <a href="home.html">Home</a>
  <a href="reader-library.html">Reader Library</a>
  <a href="know-truth.html">Original Library</a>
  <button type="button" id="prevBook">Previous</button>
  <button type="button" id="nextBook">Next</button>
  <button type="button" id="largeText">Large Text</button>
  <button type="button" id="plainMode">Plain Mode</button>
  <button type="button" id="printPage">Print</button>
</nav>
<div class="reader-status" id="readerStatus">Loading book…</div>
<main id="bookContent" aria-live="polite"></main>

<script>
const totalBooks = 27;
const params = new URLSearchParams(window.location.search);
let currentBook = Number.parseInt(params.get("book") || "1", 10);
if (!Number.isFinite(currentBook)) currentBook = 1;
currentBook = Math.max(1, Math.min(totalBooks, currentBook));

const bookContent = document.getElementById("bookContent");
const readerStatus = document.getElementById("readerStatus");
const prevBook = document.getElementById("prevBook");
const nextBook = document.getElementById("nextBook");

function padBook(value) {
  return String(value).padStart(2, "0");
}

function bookPath(value) {
  return `books/book-${padBook(value)}.html`;
}

function updateUrl() {
  const url = new URL(window.location.href);
  url.searchParams.set("book", padBook(currentBook));
  history.replaceState(null, "", url);
}

async function loadBook() {
  const path = bookPath(currentBook);
  readerStatus.textContent = `Loading Book ${currentBook} of ${totalBooks}…`;
  prevBook.disabled = currentBook === 1;
  nextBook.disabled = currentBook === totalBooks;
  updateUrl();

  try {
    const response = await fetch(path);
    if (!response.ok) throw new Error("Book file could not be loaded.");
    const html = await response.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const originalContent = doc.querySelector(".container") || doc.body;
    bookContent.innerHTML = originalContent.innerHTML;
    readerStatus.textContent = `Book ${currentBook} of ${totalBooks}`;
    document.title = `Book ${currentBook} | Life in Holy Bible`;
  } catch (error) {
    bookContent.innerHTML = `<p style="padding:24px;text-align:center;">Unable to load this book. <a href="${path}">Open the original book page</a>.</p>`;
    readerStatus.textContent = "Book could not be loaded.";
  }
}

prevBook.addEventListener("click", () => {
  if (currentBook > 1) {
    currentBook -= 1;
    loadBook();
  }
});

nextBook.addEventListener("click", () => {
  if (currentBook < totalBooks) {
    currentBook += 1;
    loadBook();
  }
});

document.getElementById("largeText").addEventListener("click", () => {
  document.body.classList.toggle("reader-large-text");
});

document.getElementById("plainMode").addEventListener("click", () => {
  document.body.classList.toggle("reader-plain-mode");
});

document.getElementById("printPage").addEventListener("click", () => {
  window.print();
});

loadBook();
</script>
</body>
</html>
