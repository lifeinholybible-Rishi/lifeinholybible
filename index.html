<style>
    * {
        box-sizing: border-box;
    }

    body, html {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-image: conic-gradient( purple,rgb(53, 50, 50),purple,rgb(53, 50, 50),purple,rgb(53, 50, 50),purple,rgb(53, 50, 50),purple,rgb(53, 50, 50),purple,rgb(53, 50, 50));
    }

    .container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .five-pointed-star {
        --star-color: gold;
        margin: 1em auto;
        font-size: clamp(5rem, 18vw, 10em);
        position: relative;
        display: block;
        width: 0px;
        height: 0px;
        border-right: 1em solid transparent;
        border-bottom: 0.7em solid var(--star-color);
        border-left: 1em solid transparent;
        transform: rotate(35deg);
        transition: opacity 0.5s ease; /* Added transition for smooth disappearance */
        background-image: conic-gradient(yellow, goldenrod, yellow, goldenrod, yellow, goldenrod, yellow, goldenrod, yellow, goldenrod, yellow, goldenrod);
    }

    .five-pointed-star:before {
        border-bottom: 0.8em solid var(--star-color);
        border-left: 0.3em solid transparent;
        border-right: 0.3em solid transparent;
        position: absolute;
        height: 0;
        width: 0;
        top: -0.45em;
        left: -0.65em;
        display: block;
        content: "";
        transform: rotate(-35deg);
    }

    .five-pointed-star:after {
        position: absolute;
        display: block;
        top: 0.03em;
        left: -1.05em;
        width: 0;
        height: 0;
        border-right: 1em solid transparent;
        border-bottom: 0.7em solid var(--star-color);
        border-left: 1em solid transparent;
        transform: rotate(-70deg);
        content: "";
    }

    .plus-symbol {
        display: none; /* Initially hide the plus symbol */
        font-size: clamp(5rem, 18vw, 10em); /* Adjust size as needed */
        color: goldenrod; /* Adjust color as needed */
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    /* Customize the appearance of the plus symbol using pseudo-elements */
    .plus-symbol::before,
    .plus-symbol::after {
        content: '';
        position:absolute;
    }

    /* Vertical line */
    .plus-symbol::before {
        width: clamp(32px, 6vw, 60px); /* Adjust width as needed */
        height: clamp(220px, 45vw, 400px); /* Adjust height as needed */
        top: calc(50% - 150px); /* Center vertically */
        left: calc(50% - 30px); /* Center horizontally */
        background-image: conic-gradient(yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow);
    }

    /* Horizontal line */
    .plus-symbol::after {
        
        width: clamp(140px, 35vw, 220px); /* Adjust width as needed */
        height: clamp(32px, 6vw, 60px); /* Adjust height as needed */
        top: calc(50% - 70px); /* Center vertically above the center of the vertical line */
        left: calc(50% - 110px); /* Center horizontally */
        background-image: conic-gradient(yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow,goldenrod,yellow,goldenrod);
    }

    @media (max-width: 520px) {
        .plus-symbol::before {
            top: calc(50% - 95px);
            left: calc(50% - 16px);
        }

        .plus-symbol::after {
            top: calc(50% - 32px);
            left: calc(50% - 70px);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .five-pointed-star {
            transition: none;
        }
    }
</style>
</head>
<body>
<div class="container" aria-label="Life in Holy Bible opening animation">
    <div class="five-pointed-star" aria-hidden="true"></div>
    <div class="plus-symbol" aria-hidden="true"></div>
</div>
<noscript>
    <p style="text-align:center; color:white; font-family:Arial, sans-serif;">
        <a href="home.html" style="color:gold;">Continue to Life in Holy Bible</a>
    </p>
</noscript>

<script>
    setTimeout(function() {
        var star = document.querySelector('.five-pointed-star');
        star.style.opacity = '0'; // Make the star disappear

        setTimeout(function() {
            star.remove(); // Completely remove the star from the DOM

            var plusSymbol = document.querySelector('.plus-symbol');
            plusSymbol.style.display = 'block'; // Make the plus symbol appear

            setTimeout(function() {
                window.location.href = 'home.html'; // Redirect to another page after 6 seconds
            }, 2500); // Delay for 2 seconds after the plus symbol appears
        }, 50); // Delay for 0.5 seconds after the star disappears
    }, 2500); // Delay for 4 seconds before the star disappears
</script>
</body>
